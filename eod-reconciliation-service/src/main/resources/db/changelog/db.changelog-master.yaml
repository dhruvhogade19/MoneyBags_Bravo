databaseChangeLog:
  - changeSet:
      id: 001-create-eod-business-date
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: EOD_BUSINESS_DATE
      changes:
        - sqlFile:
            path: db/changelog/changes/001-create-eod-business-date.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 002-create-eod-run
      author: moneybags

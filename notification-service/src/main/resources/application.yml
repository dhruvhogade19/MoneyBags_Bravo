server:
  port: ${SERVER_PORT:8090}

moneybags:
  cif:
    base-url: ${CIF_BASE_URL:http://CIF-SERVICE}
  mock-cif:
    email: ${MOCK_CIF_EMAIL:customer@example.test}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@moneybags.local}
    provider: ${MAIL_PROVIDER:mailpit}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlationId:-}","message":"%m"}%n'

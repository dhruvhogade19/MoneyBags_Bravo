spring:
  datasource:
    url: jdbc:h2:mem:statements;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true

eureka:
  client:
    enabled: false

moneybags:
  security:
    enabled: false
  statements:
    stub-upstream-clients: true

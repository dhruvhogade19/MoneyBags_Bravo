databaseChangeLog:
  - changeSet:
      id: 001-billing-schema
      author: moneybags
      # The first Oracle run may have created BILL before encountering the
      # redundant index that was removed from the SQL. Treat that baseline as
      # installed; later changesets repair any objects it did not reach.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: BILL
      changes:
        - sqlFile:
            path: db/changelog/changes/001-billing-schema.sql
            splitStatements: true
            stripComments: true

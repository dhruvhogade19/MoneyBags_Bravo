server:
  port: 8087
  shutdown: graceful
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: bill-generation-service
  datasource:
    url: ${MONEYBAGS_DB_URL:${DB_URL:jdbc:oracle:thin:@//ofss-mum-1212.snbomprshared1.gbucdsint02bom.oraclevcn.com:1521/PDB1}}
    username: ${MONEYBAGS_DB_USERNAME:${DB_USERNAME:BRAVO}}
    password: ${MONEYBAGS_DB_PASSWORD:${DB_PASSWORD:moneybags}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:testdata}
eureka:
  client:
    # Bill Generation is runnable on its own for local Oracle/Postman testing.
    # Set EUREKA_ENABLED=true when discovery-server is running on port 8761.
    enabled: ${EUREKA_ENABLED:false}
    service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
moneybags:
  security.enabled: ${SECURITY_ENABLED:false}
  billing.stub-upstream-clients: ${STUB_UPSTREAM_CLIENTS:true}
  billing.stub-notification-client: ${STUB_NOTIFICATION_CLIENT:${STUB_UPSTREAM_CLIENTS:true}}
springdoc:
  swagger-ui.path: /swagger-ui.html
management:
  endpoints.web.exposure.include: health,info,metrics

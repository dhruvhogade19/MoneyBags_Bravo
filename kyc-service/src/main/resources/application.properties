spring.application.name=kyc-service

# SERVER
server.port=8082

# ORACLE DATABASE
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# LIQUIBASE
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# MULTIPART FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

## EXTERNAL SERVICES
#services.cif.base-url=http://localhost:8081
services.cif.base-url=${CIF_SERVICE_URL:http://CIF-SERVICE}
services.notification.base-url=${NOTIFICATION_SERVICE_URL:http://NOTIFICATION-SERVICE}
#services.notification.base-url=http://localhost:8090

# Disable Eureka for local development
#eureka.client.enabled=false
#spring.cloud.discovery.enabled=false

# EUREKA
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true

# OPENAPI / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

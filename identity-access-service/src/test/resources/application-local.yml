spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    enabled: false

spring.cloud.discovery.enabled: false

moneybags:
  identity:
    registration:
      enabled: true
    clients:
      service-secret: local-service-secret-change-me
    bootstrap:
      admin-password: ChangeThisAdminPassword!
      consumer-password: ChangeThisConsumerPassword!

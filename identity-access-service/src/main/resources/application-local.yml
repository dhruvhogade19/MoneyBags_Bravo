spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none

moneybags:
  identity:
    clients:
      service-secret: ${M2M_CLIENT_SECRET:local-service-secret-change-me}
    bootstrap:
      admin-password: ${LOCAL_ADMIN_PASSWORD:ChangeThisAdminPassword!}
      consumer-password: ${LOCAL_CONSUMER_PASSWORD:ChangeThisConsumerPassword!}

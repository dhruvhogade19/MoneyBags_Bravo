spring:
  datasource:
    url: jdbc:h2:mem:deposit;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: testdata

eureka:
  client:
    enabled: false

moneybags:
  security:
    enabled: false
    # Fixed non-production AES-256 key used only by nominee API tests.
    pii-key-base64: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  deposit:
    stub-upstream-clients: true
    account-number-prefix: MB
    account-number-random-digits: 12
    idempotency-ttl-hours: 24
  notifications:
    dispatch-enabled: false

databaseChangeLog:
  # Fresh schema: execute the baseline. Existing pre-Liquibase schema: adopt it
  # without recreating DEPOSIT_ACCOUNT; Hibernate validation then confirms that
  # the remaining baseline objects are compatible.
  - changeSet:
      id: 001-create-deposit-account-schema
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: DEPOSIT_ACCOUNT
      changes:
        - sqlFile:
            path: db/migration/V1__create_deposit_account_schema.sql
            splitStatements: true
            stripComments: true

  # Kafka/outbox is not used. Drop the old table only when it exists.
  - changeSet:
      id: 002-remove-kafka-outbox
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: OUTBOX_EVENT
      changes:
        - sqlFile:
            path: db/migration/V2__remove_kafka_outbox.sql
            splitStatements: true
            stripComments: true

  # Apply payment operations only when they have not already been installed.
  - changeSet:
      id: 003-add-payment-operations
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: FUND_RESERVATION
      changes:
        - sqlFile:
            path: db/changelog/changes/003-add-payment-operations.sql
            splitStatements: true
            stripComments: true

  # Some legacy schemas contain DEPOSIT_ACCOUNT but were created before the
  # audit table was introduced. Repair only that missing object.
  - changeSet:
      id: 004-repair-missing-audit-log
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: AUDIT_LOG
      changes:
        - sqlFile:
            path: db/changelog/changes/004-repair-missing-audit-log.sql
            splitStatements: true
            stripComments: true

  # Deterministic local accounts used by Swagger and Postman. Disable this in
  # non-development environments with LIQUIBASE_CONTEXTS=schema.
  - changeSet:
      id: 005-seed-postman-test-data
      author: moneybags
      context: testdata
      changes:
        - sqlFile:
            path: db/changelog/changes/005-seed-postman-test-data.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 006-add-fixed-deposit
      author: moneybags
      changes:
        - sqlFile:
            path: db/changelog/changes/006-add-fixed-deposit.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 007-add-account-closure
      author: moneybags
      changes:
        - sqlFile:
            path: db/changelog/changes/007-add-account-closure.sql
            splitStatements: true
            stripComments: true

  # Complete deterministic data for the expanded Postman collection. This is
  # deliberately after the fixed-deposit and closure schema changes.
  - changeSet:
      id: 008-seed-complete-postman-test-data
      author: moneybags
      context: postman
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: FIXED_DEPOSIT
        - tableExists:
            tableName: ACCOUNT_CLOSURE_REQUEST
      changes:
        - sqlFile:
            path: db/changelog/changes/008-seed-complete-postman-test-data.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 009-add-notification-outbox
      author: moneybags
      changes:
        - sqlFile:
            path: db/changelog/changes/009-add-notification-outbox.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 010-add-fd-accounting-posting-state
      author: moneybags
      # Oracle commits DDL. If an older launch stopped between statements, mark
      # the original changeset and let the guarded repairs below add only what
      # is still absent. ANY also accepts the checksum already deployed locally.
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - and:
            - not:
                - columnExists:
                    tableName: FD_INTEREST_ACCRUAL
                    columnName: ACCOUNTING_JOURNAL_NUMBER
            - not:
                - columnExists:
                    tableName: FD_INTEREST_ACCRUAL
                    columnName: ACCOUNTING_POSTING_STATUS
            - not:
                - columnExists:
                    tableName: FD_PAYOUT
                    columnName: ACCOUNTING_JOURNAL_NUMBER
            - not:
                - columnExists:
                    tableName: FD_PAYOUT
                    columnName: ACCOUNTING_POSTING_STATUS
      changes:
        - sqlFile:
            path: db/changelog/changes/010-add-fd-accounting-posting-state.sql
            splitStatements: true
            stripComments: true

  - changeSet:
      id: 010a-repair-fd-accrual-accounting-journal
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: FD_INTEREST_ACCRUAL
                columnName: ACCOUNTING_JOURNAL_NUMBER
      changes:
        - addColumn:
            tableName: FD_INTEREST_ACCRUAL
            columns:
              - column:
                  name: ACCOUNTING_JOURNAL_NUMBER
                  type: VARCHAR2(100)

  - changeSet:
      id: 010b-repair-fd-accrual-accounting-status
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: FD_INTEREST_ACCRUAL
                columnName: ACCOUNTING_POSTING_STATUS
      changes:
        - addColumn:
            tableName: FD_INTEREST_ACCRUAL
            columns:
              - column:
                  name: ACCOUNTING_POSTING_STATUS
                  type: VARCHAR2(20)

  - changeSet:
      id: 010c-repair-fd-payout-accounting-journal
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: FD_PAYOUT
                columnName: ACCOUNTING_JOURNAL_NUMBER
      changes:
        - addColumn:
            tableName: FD_PAYOUT
            columns:
              - column:
                  name: ACCOUNTING_JOURNAL_NUMBER
                  type: VARCHAR2(100)

  - changeSet:
      id: 010d-repair-fd-payout-accounting-status
      author: moneybags
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: FD_PAYOUT
                columnName: ACCOUNTING_POSTING_STATUS
      changes:
        - addColumn:
            tableName: FD_PAYOUT
            columns:
              - column:
                  name: ACCOUNTING_POSTING_STATUS
                  type: VARCHAR2(20)

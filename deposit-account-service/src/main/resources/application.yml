server:
  port: 8086
  shutdown: graceful

spring:
  application:
    name: deposit-account-service
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:2000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:5000}
            logger-level: basic
      oauth2:
        enabled: ${FEIGN_OAUTH2_ENABLED:false}
        client-registration-id: ${FEIGN_OAUTH2_CLIENT_REGISTRATION_ID:moneybags-service}
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//ofss-mum-1212.snbomprshared1.gbucdsint02bom.oraclevcn.com:1521/PDB1}
    username: ${DB_USERNAME:BRAVO}
    password: ${DB_PASSWORD:Bravo@123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:15000}
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

moneybags:
  security:
    enabled: ${SECURITY_ENABLED:false}
    pii-key-base64: ${MONEYBAGS_PII_KEY_BASE64:}
  deposit:
    account-number-prefix: ${ACCOUNT_NUMBER_PREFIX:MB}
    account-number-random-digits: ${ACCOUNT_NUMBER_DIGITS:12}
    stub-upstream-clients: ${STUB_UPSTREAM_CLIENTS:true}
    idempotency-ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      referenceServices:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}
  metrics:
    tags:
      service: ${spring.application.name}

server:
  port: 8086
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: deposit-account-service
  datasource:
    url: ${MONEYBAGS_DB_URL:${DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}}
    username: ${MONEYBAGS_DB_USERNAME:${DB_USERNAME:moneybags}}
    password: ${MONEYBAGS_DB_PASSWORD:${DB_PASSWORD:moneybags}}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:15000}
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:testdata,postman}
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

moneybags:
  http:
    connect-timeout: ${UPSTREAM_CONNECT_TIMEOUT:2s}
    read-timeout: ${UPSTREAM_READ_TIMEOUT:5s}
  clients:
    cif:
      base-url: ${CIF_URL:http://cif-service}
    product-master:
      base-url: ${PRODUCT_MASTER_URL:http://product-master-service}
      access-token: ${PRODUCT_MASTER_ACCESS_TOKEN:}
  security:
    enabled: ${SECURITY_ENABLED:false}
    pii-key-base64: ${MONEYBAGS_PII_KEY_BASE64:}
  deposit:
    account-number-prefix: ${ACCOUNT_NUMBER_PREFIX:MB}
    account-number-random-digits: ${ACCOUNT_NUMBER_DIGITS:12}
    stub-upstream-clients: ${STUB_UPSTREAM_CLIENTS:true}
    idempotency-ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    instances:
      referenceServices:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      productMaster:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      cifService:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      productMaster:
        max-attempts: 2
        wait-duration: 200ms
        retry-exceptions:
          - org.springframework.web.client.RestClientException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}
  metrics:
    tags:
      service: ${spring.application.name}

server:
  port: 8088
  shutdown: graceful

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: accounting-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  datasource:
    url: ${MONEYBAGS_ACCOUNTING_DB_URL:${MONEYBAGS_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}}
    username: ${MONEYBAGS_ACCOUNTING_DB_USERNAME:${MONEYBAGS_DB_USERNAME:MONEYBAGS_ACCOUNTING}}
    password: ${MONEYBAGS_ACCOUNTING_DB_PASSWORD:${MONEYBAGS_DB_PASSWORD:moneybags}}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${ACCOUNTING_DB_POOL_MAX:15}
      minimum-idle: ${ACCOUNTING_DB_POOL_MIN:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:15000}
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

moneybags:
  security:
    enabled: ${SECURITY_ENABLED:false}
  accounting:
    enforce-account-registration: ${ACCOUNTING_ENFORCE_ACCOUNT_REGISTRATION:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when_authorized}
  metrics:
    tags:
      service: ${spring.application.name}

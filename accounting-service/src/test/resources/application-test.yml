spring:
  datasource:
    url: ${ACCOUNTING_TEST_DB_URL:jdbc:h2:mem:accounting;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true}
    username: ${ACCOUNTING_TEST_DB_USERNAME:sa}
    password: ${ACCOUNTING_TEST_DB_PASSWORD:}
    driver-class-name: ${ACCOUNTING_TEST_DB_DRIVER:org.h2.Driver}
  jpa:
    database-platform: ${ACCOUNTING_TEST_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: none
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

eureka:
  client:
    enabled: false

moneybags:
  security:
    enabled: false
  accounting:
    enforce-account-registration: true

<section class="mb-feature-page">
  <div class="mb-container mb-narrow-container">
    <header class="mb-page-heading"><div><p class="mb-eyebrow">Customer workspace</p><h1>Notifications</h1><p class="mb-hero-lead">Payment, KYC, account, bill, and security updates in one clear inbox.</p></div></header>
    <div class="mb-toolbar"><div class="mb-filter-group" role="group" aria-label="Notification status"><button class="mb-filter-chip" type="button" data-bind="click: function () { filter('ALL'); }, css: { 'is-active': filter() === 'ALL' }">All</button><button class="mb-filter-chip" type="button" data-bind="click: function () { filter('SENT'); }, css: { 'is-active': filter() === 'SENT' }">Sent</button><button class="mb-filter-chip" type="button" data-bind="click: function () { filter('FAILED'); }, css: { 'is-active': filter() === 'FAILED' }">Delivery issues</button></div><button class="mb-button mb-button-outline" type="button" data-bind="click: load">Refresh</button></div>
    <div class="mb-state-card" data-bind="visible: loading" role="status"><oj-progress-circle size="sm" value="-1"></oj-progress-circle><span>Loading notifications...</span></div><div class="mb-alert mb-alert-error" data-bind="visible: errorMessage, text: errorMessage" role="alert"></div>

    <div class="mb-inbox-layout" data-bind="visible: !loading() && !errorMessage()">
      <section class="mb-panel mb-inbox-list" aria-labelledby="notification-list-heading"><div class="mb-panel-heading"><h2 id="notification-list-heading">Inbox</h2><span data-bind="text: visibleNotifications().length"></span></div><div class="mb-empty-copy" data-bind="visible: visibleNotifications().length === 0">No notifications match this filter.</div><ul class="mb-notification-list" data-bind="foreach: visibleNotifications"><li><button type="button" data-bind="click: $parent.openNotification, css: { 'is-selected': $parent.selectedNotification() && $parent.selectedNotification().notificationId === notificationId }"><span class="mb-notification-icon" aria-hidden="true">i</span><span><strong data-bind="text: emailSubject"></strong><small data-bind="text: $parent.label(notificationType) + ' / ' + $parent.dateTime(createdAt)"></small></span><span class="mb-status" data-bind="text: $parent.label(status), css: $parent.statusClass(status)"></span></button></li></ul></section>

      <section class="mb-panel mb-inbox-detail" data-bind="with: selectedNotification" aria-live="polite"><button class="mb-back-link" type="button" data-bind="click: $parent.closeNotification">Close message</button><p class="mb-eyebrow" data-bind="text: $parent.label(notificationType)"></p><h2 data-bind="text: emailSubject"></h2><p class="mb-notification-body" data-bind="text: emailBody"></p><dl class="mb-key-values"><div><dt>Created</dt><dd data-bind="text: $parent.dateTime(createdAt)"></dd></div><div><dt>Delivered</dt><dd data-bind="text: sentAt ? $parent.dateTime(sentAt) : 'Not delivered'"></dd></div><div><dt>Reference</dt><dd data-bind="text: sourceReference"></dd></div></dl></section>
      <section class="mb-panel mb-empty-state" data-bind="visible: !selectedNotification()"><h2>Select a notification</h2><p>Open an item to see its complete message and delivery status.</p></section>
    </div>
  </div>
</section>

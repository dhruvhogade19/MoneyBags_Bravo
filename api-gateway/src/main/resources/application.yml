server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-master-service
              uri: lb://product-master-service
              predicates:
                - Path=/api/products/**,/api/v1/products/**,/api/benchmarks/**
            - id: deposit-account-service
              uri: lb://deposit-account-service
              predicates:
                - Path=/api/deposit-accounts/**,/api/internal/deposit-accounts/**,/api/internal/deposit-payment-operations/**
            - id: payments-service
              uri: lb://payments-service
              predicates:
                - Path=/api/v1/payments/**
            - id: cif-service
              uri: lb://cif-service
              predicates:
                - Path=/api/v1/cifs/**
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGIN:http://localhost:8000}"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

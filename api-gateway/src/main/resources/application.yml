server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8093}
          audiences: ${OAUTH2_AUDIENCE:moneybags-api}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-access-service
              uri: lb://identity-access-service
              predicates:
                - Path=/api/v1/identity/**
            - id: product-master-service
              uri: lb://product-master-service
              predicates:
                - Path=/api/products/**,/api/v1/products/**,/api/benchmarks/**
            - id: deposit-account-service
              uri: lb://deposit-account-service
              predicates:
                - Path=/api/deposit-accounts/**
            - id: payments-service
              uri: lb://payments-service
              predicates:
                - Path=/api/v1/payments/**
            - id: cif-service
              uri: lb://cif-service
              predicates:
                - Path=/api/v1/cifs/**
            - id: kyc-service
              uri: lb://kyc-service
              predicates:
                - Path=/api/v1/kycs/**
            - id: credit-card-service
              uri: lb://credit-card-service
              predicates:
                - Path=/api/credit-cards/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
            - id: bill-generation-service
              uri: lb://bill-generation-service
              predicates:
                - Path=/api/v1/bills/**
            - id: statements-service
              uri: lb://statements-service
              predicates:
                - Path=/api/v1/statements/**
            - id: accounting-service
              uri: lb://accounting-service
              predicates:
                - Path=/api/v1/journals/**,/api/v1/gl-accounts/**,/api/v1/accounting-rules/**,/api/v1/subledger-mappings/**,/api/v1/trial-balances/**,/api/v1/reconciliations/**,/api/v1/accounting-periods/**,/api/v1/account-ledgers/**,/api/v1/accounting/**
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "${CORS_ALLOWED_ORIGIN:http://localhost:8000}"
                allowedMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowedHeaders: "*"
                allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

moneybags:
  security:
    enabled: ${SECURITY_ENABLED:true}

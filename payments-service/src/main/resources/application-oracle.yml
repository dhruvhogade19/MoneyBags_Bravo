# Activate with: $env:SPRING_PROFILES_ACTIVE="oracle"
# Shared root .env values are preferred; PAYMENTS_DB_* remain local fallbacks.
spring:
  datasource:
    url: "${MONEYBAGS_DB_URL:${PAYMENTS_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}}"
    username: "${MONEYBAGS_DB_USERNAME:${PAYMENTS_DB_USERNAME:moneybags}}"
    password: "${MONEYBAGS_DB_PASSWORD:${PAYMENTS_DB_PASSWORD:moneybags}}"
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: "${LIQUIBASE_CONTEXTS:schema,testdata}"
eureka:
  client:
    enabled: "${EUREKA_ENABLED:true}"

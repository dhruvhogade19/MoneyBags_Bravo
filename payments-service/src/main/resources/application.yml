spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: payments-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8093}
          audiences: ${OAUTH2_AUDIENCE:moneybags-api}
  profiles:
    default: oracle
  datasource:
    url: ${MONEYBAGS_DB_URL:${PAYMENTS_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}}
    username: ${MONEYBAGS_DB_USERNAME:${PAYMENTS_DB_USERNAME:moneybags}}
    password: ${MONEYBAGS_DB_PASSWORD:${PAYMENTS_DB_PASSWORD:moneybags}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${LIQUIBASE_CONTEXTS:schema,testdata}
  jackson:
    default-property-inclusion: non_null

server:
  port: "${SERVER_PORT:8085}"

moneybags:
  security:
    enabled: ${SECURITY_ENABLED:true}

eureka:
  client:
    enabled: "${EUREKA_ENABLED:false}"
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

clients:
  deposit:
    base-url: "${DEPOSIT_BASE_URL:http://localhost:8086}"
  credit-card:
    base-url: "${CREDIT_CARD_BASE_URL:http://localhost:8084}"
  billing:
    base-url: "${BILLING_BASE_URL:http://localhost:8087}"
  accounting:
    base-url: "${ACCOUNTING_BASE_URL:http://localhost:8088}"
    service-token: "${ACCOUNTING_SERVICE_TOKEN:service-token}"
  notification:
    base-url: "${NOTIFICATION_BASE_URL:http://localhost:8090}"

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlationId:-}","message":"%m"}%n'

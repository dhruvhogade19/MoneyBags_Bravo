spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: payments-service
  profiles:
    default: oracle
  datasource:
    url: jdbc:h2:mem:payments;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  liquibase:
    enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: "${SERVER_PORT:8085}"

eureka:
  client:
    enabled: "${EUREKA_ENABLED:false}"
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

clients:
  deposit:
    base-url: "${DEPOSIT_BASE_URL:http://localhost:8086}"
  credit-card:
    base-url: "${CREDIT_CARD_BASE_URL:http://localhost:8084}"
  billing:
    base-url: "${BILLING_BASE_URL:http://localhost:8087}"
  accounting:
    base-url: "${ACCOUNTING_BASE_URL:http://localhost:8088}"
    service-token: "${ACCOUNTING_SERVICE_TOKEN:service-token}"
  notification:
    base-url: "${NOTIFICATION_BASE_URL:http://localhost:8090}"

logging:
  pattern:
    console: '{"timestamp":"%d{ISO8601}","level":"%p","logger":"%logger{36}","correlationId":"%X{correlationId:-}","message":"%m"}%n'

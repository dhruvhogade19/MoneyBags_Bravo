server:
  port: 8084
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: credit-card-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8093}
          audiences: ${OAUTH2_AUDIENCE:moneybags-api}
  datasource:
    url: ${CREDIT_CARD_DB_URL:${MONEYBAGS_DB_URL:jdbc:oracle:thin:@//localhost:1522/FREEPDB1}}
    username: ${CREDIT_CARD_DB_USERNAME:${MONEYBAGS_DB_USERNAME:moneybags}}
    password: ${CREDIT_CARD_DB_PASSWORD:${MONEYBAGS_DB_PASSWORD:moneybags}}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url.defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
moneybags:
  security:
    enabled: ${SECURITY_ENABLED:true}
  credit-card:
    stub-upstream-clients: ${STUB_UPSTREAM_CLIENTS:true}
    cif-base-url: ${CIF_URL:http://localhost:8081}
    product-base-url: ${PRODUCT_URL:http://localhost:8083}
    accounting-base-url: ${ACCOUNTING_URL:http://localhost:8088}
    notification-base-url: ${NOTIFICATION_URL:http://localhost:8090}
springdoc.swagger-ui.path: /swagger-ui.html
management.endpoints.web.exposure.include: health,info,metrics,prometheus
